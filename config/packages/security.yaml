security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        admin:
            pattern: ^/admin
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: /admin
            logout:
                path: /admin/logout
                target: /admin/login
            access_denied_handler: App\Security\AdminAccessDeniedHandler

        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/admin/login,        roles: PUBLIC_ACCESS }
        - { path: ^/admin,              roles: ROLE_ADMIN }
        - { path: ^/api/login_check,    roles: PUBLIC_ACCESS }
        - { path: ^/api/docs,           roles: PUBLIC_ACCESS }
        - { path: ^/api/products,       roles: PUBLIC_ACCESS }
        - { path: ^/api/images,         roles: PUBLIC_ACCESS }
        - { path: ^/api/platforms,      roles: PUBLIC_ACCESS }
        - { path: ^/api/users,          roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/invoices,       roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/payment_methods,roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/product_keys,   roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/users,          roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api,                roles: IS_AUTHENTICATED_FULLY }
